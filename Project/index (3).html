<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEADZONE — Auto-Trigger Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Mono&display=swap');

  :root {
    --bg: #0b0d0e;
    --panel: #131619;
    --border: #2c2f33;
    --accent: #8ab4f8; /* Gemini Blue */
    --accent2: #c58af9; /* Gemini Purple */
    --warn: #fdd663;
    --dim: #3c4043;
    --text: #e8eaed;
    --text-dim: #9aa0a6;
    --mono: 'Space Mono', monospace;
    --sans: 'Outfit', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(11, 13, 14, 0.8);
    backdrop-filter: blur(10px);
  }

  .logo { font-weight: 700; font-size: 1.4rem; letter-spacing: 0.15em; }
  .logo span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .status-bar { display: flex; gap: 24px; font-size: 0.75rem; font-family: var(--mono); color: var(--text-dim); }
  .status-item { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); transition: 0.3s; }
  .dot.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .dot.trigger { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); animation: pulse 0.5s infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    padding: 32px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .panel-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text-dim);
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  #vizCanvas { width: 100%; height: 300px; display: block; background: #000; }

  .engage-panel { padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
  
  #engageBtn {
    width: 140px; height: 140px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text-dim); font-family: var(--sans); font-weight: 500;
    cursor: pointer; transition: 0.4s;
  }

  #engageBtn.armed {
    border-color: var(--warn); color: var(--warn);
    box-shadow: 0 0 20px rgba(253, 214, 99, 0.1);
  }

  #engageBtn.transmitting {
    background: radial-gradient(circle, var(--accent2) 0%, transparent 70%);
    border-color: var(--accent2); color: #fff;
    box-shadow: 0 0 40px rgba(197, 138, 249, 0.3);
  }

  .control-row { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .ctrl-name { font-size: 0.75rem; color: var(--text); margin-bottom: 8px; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: var(--dim); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  .ctrl-val { font-family: var(--mono); font-size: 0.8rem; color: var(--accent); margin-top: 4px; display: block; }

  .metrics-panel { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(4, 1fr); }
  .metric { padding: 20px; border-right: 1px solid var(--border); }
  .metric:last-child { border-right: none; }
  .metric-label { font-family: var(--mono); font-size: 0.6rem; color: var(--text-dim); margin-bottom: 8px; }
  .metric-val { font-size: 1.5rem; font-weight: 500; }

  .log-panel { grid-column: 1 / 3; height: 100px; overflow-y: auto; font-family: var(--mono); font-size: 0.7rem; padding: 10px; color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <div class="logo">DEAD<span>ZONE</span></div>
  <div class="status-bar">
    <div class="status-item"><div class="dot" id="dotSystem"></div><span id="lblStatus">SYSTEM IDLE</span></div>
    <div class="status-item"><div class="dot" id="dotActivity"></div><span id="lblActivity">SILENCE</span></div>
  </div>
</header>

<main>
  <div class="panel" style="grid-column: 1;">
    <div class="panel-label">AUTO-TRIGGER SPECTROGRAM</div>
    <canvas id="vizCanvas"></canvas>
  </div>

  <div class="panel engage-panel">
    <button id="engageBtn" onclick="toggleSystem()">ARM SYSTEM</button>
    <div style="font-size: 0.6rem; color: var(--text-dim); text-align: center;">
      AUTO-ACTIVATE ON AUDIO DETECTION
    </div>
  </div>

  <div class="panel" style="grid-column: 1 / 3; display: grid; grid-template-columns: 1fr 1fr;">
    <div class="control-row">
      <div class="ctrl-name">Trigger Sensitivity (Threshold)</div>
      <input type="range" id="thresholdSlider" min="-80" max="-10" step="1" value="-45" oninput="updateThreshold(this)">
      <span class="ctrl-val" id="thresholdVal">-45 dB</span>
    </div>
    <div class="control-row" style="border-right: none;">
      <div class="ctrl-name">Cancellation Gain</div>
      <input type="range" id="gainSlider" min="0" max="2" step="0.01" value="1.0" oninput="updateGain(this)">
      <span class="ctrl-val" id="gainVal">1.00x</span>
    </div>
  </div>

  <div class="panel metrics-panel">
    <div class="metric">
      <div class="metric-label">ROOM NOISE</div>
      <div class="metric-val" id="mRMS">-80<span style="font-size:0.8rem; color:var(--text-dim)"> dB</span></div>
    </div>
    <div class="metric">
      <div class="metric-label">TRIGGER STATE</div>
      <div class="metric-val" id="mState" style="color:var(--text-dim)">STANDBY</div>
    </div>
    <div class="metric">
      <div class="metric-label">OUTPUT GAIN</div>
      <div class="metric-val" id="mOut">0.00x</div>
    </div>
    <div class="metric">
      <div class="metric-label">AUTO-RECOVERY</div>
      <div class="metric-val">FAST</div>
    </div>
  </div>

  <div class="panel log-panel" id="logBox">
    [SYSTEM READY] Calibration complete.
  </div>
</main>

<script>
let audioCtx, micStream, micSource, analyser, gainNode, isArmed = false, isTriggered = false;
let threshold = -45; // dB
let userGain = 1.0;

function log(msg) {
  const div = document.createElement('div');
  div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  const box = document.getElementById('logBox');
  box.prepend(div);
}

async function toggleSystem() {
  if (!isArmed) {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false }});
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      micSource = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 0; // Start muted
      
      micSource.connect(analyser);
      micSource.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      isArmed = true;
      document.getElementById('engageBtn').classList.add('armed');
      document.getElementById('engageBtn').textContent = 'SYSTEM ARMED';
      document.getElementById('dotSystem').classList.add('active');
      document.getElementById('lblStatus').textContent = 'MONITORING';
      log("System Armed. Monitoring audio threshold...");
      monitor();
      draw();
    } catch(e) { alert("Mic access required for auto-trigger."); }
  } else {
    location.reload(); // Simplest reset
  }
}

function updateThreshold(el) {
  threshold = parseInt(el.value);
  document.getElementById('thresholdVal').textContent = threshold + " dB";
}

function updateGain(el) {
  userGain = parseFloat(el.value);
  document.getElementById('gainVal').textContent = userGain.toFixed(2) + "x";
}

function monitor() {
  if (!isArmed) return;
  requestAnimationFrame(monitor);

  const data = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(data);
  
  // Calculate RMS (Volume)
  let sum = 0;
  for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
  const rms = Math.sqrt(sum / data.length);
  const db = rms > 0 ? 20 * Math.log10(rms) : -80;

  document.getElementById('mRMS').innerHTML = `${db.toFixed(1)}<span style="font-size:0.8rem; color:var(--text-dim)"> dB</span>`;

  // Auto-Trigger Logic
  if (db > threshold) {
    if (!isTriggered) {
      isTriggered = true;
      gainNode.gain.setTargetAtTime(-userGain, audioCtx.currentTime, 0.01); // Instant phase inversion
      updateUI(true);
      log("Audio detected. Engaging countermeasure.");
    }
  } else {
    if (isTriggered) {
      isTriggered = false;
      gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); // Smooth mute
      updateUI(false);
      log("Silence restored. Standby.");
    }
  }
}

function updateUI(active) {
  const btn = document.getElementById('engageBtn');
  const dot = document.getElementById('dotActivity');
  const lbl = document.getElementById('lblActivity');
  const state = document.getElementById('mState');
  const out = document.getElementById('mOut');

  if (active) {
    btn.classList.add('transmitting');
    dot.classList.add('trigger');
    lbl.textContent = "AUDIO DETECTED";
    state.textContent = "TRANSMITTING";
    state.style.color = "var(--accent2)";
    out.textContent = userGain.toFixed(2) + "x";
  } else {
    btn.classList.remove('transmitting');
    dot.classList.remove('trigger');
    lbl.textContent = "SILENCE";
    state.textContent = "STANDBY";
    state.style.color = "var(--text-dim)";
    out.textContent = "0.00x";
  }
}

function draw() {
  if (!isArmed) return;
  requestAnimationFrame(draw);
  const canvas = document.getElementById('vizCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = canvas.offsetHeight;
  
  const buffer = new Float32Array(analyser.frequencyBinCount);
  analyser.getFloatTimeDomainData(buffer);

  ctx.clearRect(0, 0, W, H);
  ctx.beginPath();
  ctx.strokeStyle = isTriggered ? '#c58af9' : '#8ab4f8';
  ctx.lineWidth = 2;

  for (let i = 0; i < buffer.length; i++) {
    const x = (i / buffer.length) * W;
    const y = (0.5 + buffer[i] * 0.5) * H;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  
  // Threshold Line
  const threshPos = H - ((threshold + 80) / 70) * H;
  ctx.setLineDash([5, 5]);
  ctx.strokeStyle = 'rgba(253, 214, 99, 0.5)';
  ctx.beginPath(); ctx.moveTo(0, threshPos); ctx.lineTo(W, threshPos); ctx.stroke();
  ctx.setLineDash([]);
}
</script>
</body>
</html>
